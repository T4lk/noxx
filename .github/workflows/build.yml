name: build

# Every push to main builds Windows (installer + portable zip), Linux (AppImage + .deb) and
# Android (.apk); the files are downloadable from the run's artifacts.
# Pushing a tag like v0.2.0 also publishes them as a GitHub release.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Test
        working-directory: src-tauri
        run: cargo test --lib

      - name: Build installer and portable zip
        shell: pwsh
        run: ./scripts/package.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: noxx-windows
          path: dist/*

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf             gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-libav

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build AppImage and .deb
        working-directory: src-tauri
        run: npx --yes @tauri-apps/cli@^2 build --bundles appimage,deb

      - name: Collect
        run: |
          ver=$(jq -r .version src-tauri/tauri.conf.json)
          mkdir -p dist
          cp src-tauri/target/release/bundle/appimage/*.AppImage "dist/noxx_${ver}_amd64.AppImage"
          cp src-tauri/target/release/bundle/deb/*.deb "dist/noxx_${ver}_amd64.deb"
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: noxx-linux
          path: dist/*

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build APK
        working-directory: src-tauri
        run: |
          # The runner image ships the Android SDK and NDK.
          export NDK_HOME="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          echo "SDK $ANDROID_HOME, NDK $NDK_HOME"
          # Maven Central sometimes answers 429 to shared runners; try again before giving up.
          npm install --no-audit --no-fund
          for i in 1 2 3; do
            npm run tauri -- android build --apk --target aarch64 && exit 0
            echo "build attempt $i failed, retrying in 60s"; sleep 60
          done
          exit 1

      # Signed with the key from the ANDROID_KEYSTORE secret (base64 .jks) when it is set,
      # otherwise with a throwaway key (installs fine, but can't update over a differently signed build).
      - name: Sign
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE }}
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          ver=$(jq -r .version src-tauri/tauri.conf.json)
          bt=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          apk=$(find src-tauri/gen/android/app/build/outputs/apk -name '*release*.apk' | head -1)
          echo "unsigned: $apk"
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/noxx.jks"
            pass="$KEYSTORE_PASS"; alias="${KEY_ALIAS:-noxx}"
          else
            pass=android; alias=noxx
            keytool -genkeypair -keystore "$RUNNER_TEMP/noxx.jks" -storepass "$pass" -keypass "$pass" -alias "$alias"               -dname "CN=noxx" -keyalg RSA -keysize 2048 -validity 10000
          fi
          mkdir -p dist
          "$bt/zipalign" -f -p 4 "$apk" "$RUNNER_TEMP/aligned.apk"
          "$bt/apksigner" sign --ks "$RUNNER_TEMP/noxx.jks" --ks-pass "pass:$pass" --ks-key-alias "$alias"             --out "dist/noxx_${ver}_android-arm64.apk" "$RUNNER_TEMP/aligned.apk"
          rm -f "$RUNNER_TEMP/noxx.jks"
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: noxx-android
          path: dist/*.apk

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
