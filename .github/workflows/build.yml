name: build

# Every push to main builds the installer and the portable zip (downloadable from the run's artifacts).
# Pushing a tag like v0.2.0 also publishes them as a GitHub release.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Test
        working-directory: src-tauri
        run: cargo test --lib

      - name: Build installer and portable zip
        shell: pwsh
        run: ./scripts/package.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: noxx-windows
          path: dist/*

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
